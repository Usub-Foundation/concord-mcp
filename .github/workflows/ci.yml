name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: concord
          POSTGRES_PASSWORD: concord
          POSTGRES_DB: concord
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U concord" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://concord:concord@localhost:5432/concord
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
