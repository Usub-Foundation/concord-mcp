# concord-mcp: Postgres + hub + Caddy (automatic HTTPS).
#   cp .env.example .env   # set CONCORD_DOMAIN, CONCORD_DB_PASSWORD, CONCORD_MEMBERS
#   docker compose up -d
#   docker compose exec hub sh -c 'cat /data/invites/*.txt'    # one invite per member
# Build from source instead of pulling the image:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
name: concord

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: concord
      POSTGRES_PASSWORD: ${CONCORD_DB_PASSWORD:?set CONCORD_DB_PASSWORD in .env}
      POSTGRES_DB: concord
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U concord"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  hub:
    image: ${CONCORD_IMAGE:-ghcr.io/usub-foundation/concord-mcp:latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://concord:${CONCORD_DB_PASSWORD}@db:5432/concord
      CONCORD_PUBLIC_URL: ${CONCORD_PUBLIC_URL:-https://localhost}
      CONCORD_ALLOWED_HOSTS: ${CONCORD_DOMAIN:-localhost}
      # First start: create the namespace and these members, write invites to /data/invites.
      CONCORD_INIT_NAMESPACE: ${CONCORD_NAMESPACE:-main}
      CONCORD_INIT_NAME: ${CONCORD_NAMESPACE_NAME:-}
      CONCORD_INIT_GOAL: ${CONCORD_GOAL:-}
      CONCORD_INIT_MEMBERS: ${CONCORD_MEMBERS:-}
      # Encrypts tracker credentials. Empty: a key is created in the data volume (/data/secret.key).
      CONCORD_SECRET_KEY: ${CONCORD_SECRET_KEY:-}
    volumes:
      - data:/data
    ports:
      # Local access without TLS (same machine only).
      - "127.0.0.1:${CONCORD_LOCAL_PORT:-8787}:8787"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      - hub
    environment:
      CONCORD_DOMAIN: ${CONCORD_DOMAIN:-localhost}
    ports:
      - "${CONCORD_BIND_ADDR:-0.0.0.0}:${CONCORD_HTTP_PORT:-80}:80"
      - "${CONCORD_BIND_ADDR:-0.0.0.0}:${CONCORD_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pg:
  data:
  caddy_data:
  caddy_config:
